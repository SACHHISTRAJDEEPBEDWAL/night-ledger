<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>Night Ledger — VCP &amp; Momentum Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   NIGHT LEDGER — a 3am trading desk crossed with a bahi-khata account book.
   Ink paper, saffron rule, jade and vermillion for the tape.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --ink:#0A0B0D;
  --ink-2:#0E1013;
  --panel:#12161A;
  --panel-2:#161B20;
  --rule:rgba(232,225,211,.065);
  --rule-hard:rgba(232,225,211,.13);
  --saffron:#F2A03D;
  --saffron-soft:rgba(242,160,61,.14);
  --jade:#31C48D;
  --jade-soft:rgba(49,196,141,.13);
  --vermillion:#F0554B;
  --vermillion-soft:rgba(240,85,75,.13);
  --paper:#E8E1D3;
  --muted:#867F73;
  --muted-2:#5E594F;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --rail:300px;
  --detail:352px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:var(--mono);
  font-size:13px;
  font-weight:400;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  background-image:
    radial-gradient(1100px 560px at 88% -12%, rgba(242,160,61,.11), transparent 62%),
    radial-gradient(840px 520px at 2% 112%, rgba(49,196,141,.055), transparent 60%),
    repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px);
  background-attachment:fixed;
}
::selection{background:var(--saffron);color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--rule-hard);border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--saffron-soft)}

/* ─────────────────────────────────────────────────────────── shell */
.shell{display:flex;flex-direction:column;height:100dvh}

header.masthead{
  display:flex;align-items:baseline;gap:20px;
  padding:14px 22px 10px;
  border-bottom:1px solid var(--rule-hard);
  background:linear-gradient(to bottom, rgba(10,11,13,.96), rgba(10,11,13,.72));
  backdrop-filter:blur(14px);
  position:relative;flex:none;
}
header.masthead::after{
  content:"";position:absolute;left:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--saffron),transparent 65%);
  width:0;animation:rule-draw 1.4s .3s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes rule-draw{to{width:100%}}

.wordmark{
  font-family:var(--serif);font-size:27px;line-height:1;
  letter-spacing:.2px;white-space:nowrap;
  animation:fade-up .7s cubic-bezier(.16,1,.3,1) both;
}
.wordmark em{font-style:italic;color:var(--saffron)}
.tagline{
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-2);white-space:nowrap;
  animation:fade-up .7s .08s cubic-bezier(.16,1,.3,1) both;
}
.masthead-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}

.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border:1px solid var(--rule-hard);
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;background:rgba(18,22,26,.6);
  animation:fade-up .7s .16s cubic-bezier(.16,1,.3,1) both;
}
.pill b{color:var(--paper);font-weight:500;letter-spacing:.04em}
.pill.hot{color:var(--saffron);border-color:rgba(242,160,61,.35);background:var(--saffron-soft)}
.pill.live{color:var(--jade);border-color:rgba(49,196,141,.32);background:var(--jade-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.dot.beat{animation:beat 1.9s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1;box-shadow:0 0 0 0 currentColor}50%{opacity:.45;box-shadow:0 0 0 4px transparent}}

/* ─────────────────────────────────────────────────────── ticker tape */
.tape{
  flex:none;height:30px;overflow:hidden;position:relative;
  border-bottom:1px solid var(--rule-hard);
  background:rgba(14,16,19,.72);
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
}
.tape-track{display:flex;gap:30px;align-items:center;height:100%;padding-left:22px;
  animation:crawl 64s linear infinite;width:max-content}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape-item{display:flex;gap:8px;align-items:baseline;font-size:11.5px;white-space:nowrap}
.tape-item .sym{color:var(--muted);letter-spacing:.05em}
.tape-item .px{color:var(--paper);font-weight:500}
.tape-empty{padding-left:22px;color:var(--muted-2);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;line-height:30px}

/* ─────────────────────────────────────────────────── manual controls */
/* Lives above the columns and stays visible at every width. The desktop
   footer used to be the only place these existed, and it is hidden on
   mobile — which left a phone with no controls at all. */
.toolbar{
  flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 22px;border-bottom:1px solid var(--rule-hard);
  background:rgba(14,16,19,.5);
}
.toolbar .spacer{margin-left:auto}
.toolbar .note{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2)}
button.act{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--ink-2);border:1px solid var(--rule-hard);color:var(--paper);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:6px 11px;cursor:pointer;transition:all .18s;
}
button.act:hover:not(:disabled){color:var(--saffron);border-color:rgba(242,160,61,.45);
  background:var(--saffron-soft)}
button.act:disabled{opacity:.5;cursor:default}
button.act.primary{border-color:rgba(242,160,61,.4);color:var(--saffron);background:var(--saffron-soft)}
button.act.primary:hover:not(:disabled){background:rgba(242,160,61,.22)}
button.act.danger:hover:not(:disabled){color:var(--vermillion);border-color:rgba(240,85,75,.45);
  background:var(--vermillion-soft)}
.empty button.act{margin-top:16px}

/* Loud, because a blocked data feed is indistinguishable from an empty
   market unless we say so outright. */
.banner{flex:none;display:none;gap:11px;align-items:flex-start;
  padding:11px 22px;border-bottom:1px solid rgba(240,85,75,.32);
  background:var(--vermillion-soft);font-size:11.5px;line-height:1.65}
.banner.on{display:flex}
.banner .mark{color:var(--vermillion);font-size:14px;line-height:1.35}
.banner b{color:var(--vermillion);font-weight:500}
.banner.good{border-bottom-color:rgba(49,196,141,.32);background:var(--jade-soft)}
.banner.good .mark,.banner.good b{color:var(--jade)}

/* ────────────────────────────────────────────────────────── layout */
main{
  flex:1;display:grid;min-height:0;
  grid-template-columns:var(--rail) minmax(0,1fr) var(--detail);
}
.col{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.col + .col{border-left:1px solid var(--rule-hard)}
.col-body{overflow-y:auto;overscroll-behavior:contain;flex:1}

.sec-head{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:13px 16px 11px;border-bottom:1px solid var(--rule);
}
.sec-num{font-family:var(--serif);font-size:19px;color:var(--saffron);line-height:1}
.sec-title{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sec-meta{margin-left:auto;font-size:10.5px;color:var(--muted-2);letter-spacing:.06em}

.panel-in{animation:fade-up .75s cubic-bezier(.16,1,.3,1) both}
.col:nth-child(1) .panel-in{animation-delay:.10s}
.col:nth-child(2) .panel-in{animation-delay:.18s}
.col:nth-child(3) .panel-in{animation-delay:.26s}
@keyframes fade-up{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* ────────────────────────────────────────────────────────── search */
/* z-index is load-bearing: the `fade-up` entry animation leaves an identity
   matrix on transform, which makes this a stacking context. Without an
   explicit index the dropdown gets trapped underneath the watchlist rows. */
.search-wrap{padding:13px 16px;flex:none;position:relative;z-index:20;
  border-bottom:1px solid var(--rule)}
.col-body{position:relative;z-index:1}
.search-field{position:relative;display:flex;align-items:center}
.search-field::before{
  content:"⌕";position:absolute;left:9px;color:var(--muted-2);font-size:15px;
  transition:color .25s
}
.search-field:focus-within::before{color:var(--saffron)}
input.search{
  width:100%;padding:9px 10px 9px 27px;
  background:var(--ink-2);border:1px solid var(--rule-hard);
  color:var(--paper);font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;
  outline:none;transition:border-color .25s, box-shadow .25s, background .25s;
}
input.search::placeholder{color:var(--muted-2)}
input.search::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
input.search:focus{border-color:rgba(242,160,61,.5);box-shadow:0 0 0 3px var(--saffron-soft);background:#0B0D10}

.results{
  position:absolute;left:16px;right:16px;top:calc(100% - 4px);z-index:40;
  background:#0C0E11;border:1px solid var(--rule-hard);
  box-shadow:0 22px 48px -14px rgba(0,0,0,.9);
  max-height:340px;overflow-y:auto;
}
.results:empty{display:none}
.result{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 11px;background:none;border:0;border-bottom:1px solid var(--rule);
  color:var(--paper);font-family:var(--mono);font-size:12px;text-align:left;cursor:pointer;
  transition:background .18s, padding-left .18s;
  animation:slip .32s cubic-bezier(.16,1,.3,1) both;
}
@keyframes slip{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.result:last-child{border-bottom:0}
.result:hover,.result:focus-visible{background:var(--saffron-soft);padding-left:15px;outline:none}
.result .r-sym{color:var(--saffron);min-width:88px;font-weight:500}
.result .r-name{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.result .r-add{color:var(--muted-2);font-size:15px;line-height:1}
.result:hover .r-add{color:var(--saffron)}
.result.on{opacity:.4;pointer-events:none}

/* ─────────────────────────────────────────────────────── watchlist */
.wl-row{
  display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
  padding:10px 16px;border-bottom:1px solid var(--rule);
  cursor:pointer;position:relative;transition:background .2s;
  animation:fade-up .5s cubic-bezier(.16,1,.3,1) both;
}
.wl-row::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:background .2s
}
.wl-row:hover{background:rgba(242,160,61,.05);padding-right:36px}
.wl-row.sel{background:rgba(242,160,61,.08)}
.wl-row.sel::before{background:var(--saffron)}
.wl-sym{font-size:12.5px;font-weight:500;letter-spacing:.03em}
.wl-name{grid-column:1;font-size:10.5px;color:var(--muted-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.wl-px{font-size:12.5px;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.wl-tag{grid-column:2;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;text-align:right}
.wl-tag.ok{color:var(--jade)}
.wl-tag.no{color:var(--muted-2)}
.wl-del{
  position:absolute;right:6px;top:50%;transform:translateY(-50%) scale(.85);
  background:none;border:0;color:var(--vermillion);font-size:15px;cursor:pointer;
  opacity:0;transition:opacity .2s, transform .2s;padding:4px 6px;line-height:1;
}
.wl-row:hover .wl-del{opacity:1;transform:translateY(-50%) scale(1)}

/* ──────────────────────────────────────────────────────── the tape */
.alert{
  display:grid;grid-template-columns:58px 18px 1fr;gap:0 10px;
  padding:11px 16px;border-bottom:1px solid var(--rule);
  position:relative;overflow:hidden;
  animation:fade-up .5s cubic-bezier(.16,1,.3,1) both;
}
.alert.fresh{animation:fade-up .5s cubic-bezier(.16,1,.3,1) both, sweep 1.5s .1s ease-out}
@keyframes sweep{
  0%{background:var(--saffron-soft);box-shadow:inset 3px 0 0 var(--saffron)}
  100%{background:transparent;box-shadow:inset 3px 0 0 transparent}
}
.a-time{font-size:10.5px;color:var(--muted-2);padding-top:2px;font-variant-numeric:tabular-nums}
.a-mark{font-size:13px;line-height:1.35;text-align:center}
.a-head{font-size:13px;letter-spacing:.01em;line-height:1.4}
.a-detail{grid-column:3;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.a-kind{grid-column:3;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted-2);margin-top:5px}
.k-momentum .a-mark{color:var(--saffron)}
.k-momentum .a-head b{color:var(--saffron)}
.k-breakout .a-mark{color:var(--jade)}
.k-breakout .a-head b{color:var(--jade)}
.k-vcp_setup .a-mark{color:var(--paper)}
.k-vcp_setup .a-head b{color:var(--paper)}
.k-system .a-mark,.k-system .a-head{color:var(--muted)}

/* ───────────────────────────────────────────────────── setup detail */
.detail-pad{padding:14px 16px 26px}
.d-sym{font-family:var(--serif);font-size:31px;line-height:1.05;letter-spacing:.3px}
.d-name{font-size:10.5px;color:var(--muted-2);margin-top:2px;letter-spacing:.04em}
.verdict{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  padding:5px 10px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  border:1px solid currentColor;
}
.verdict.ok{color:var(--jade);background:var(--jade-soft)}
.verdict.no{color:var(--muted);background:rgba(232,225,211,.03)}
.reason{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.6}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:16px;
  background:var(--rule-hard);border:1px solid var(--rule-hard)}
.stat{background:var(--ink-2);padding:9px 11px}
.stat dt{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted-2)}
.stat dd{font-size:16px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:500}
.stat dd.j{color:var(--jade)}
.stat dd.s{color:var(--saffron)}
.stat dd.v{color:var(--vermillion)}

.d-label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-2);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.d-label::after{content:"";flex:1;height:1px;background:var(--rule-hard)}

svg.vcp{width:100%;height:118px;display:block;overflow:visible}
svg.vcp .leg{fill:none;stroke:var(--saffron);stroke-width:1.5;stroke-linejoin:round;
  stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s .18s cubic-bezier(.5,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
svg.vcp .pivot{stroke:var(--jade);stroke-width:1;stroke-dasharray:3 3;opacity:0;
  animation:appear .5s 1.35s forwards}
svg.vcp .stopline{stroke:var(--vermillion);stroke-width:1;stroke-dasharray:3 3;opacity:0;
  animation:appear .5s 1.5s forwards}
@keyframes appear{to{opacity:.85}}
svg.vcp text{font-family:var(--mono);font-size:8.5px;fill:var(--muted)}
svg.vcp .node{fill:var(--saffron);opacity:0;animation:appear .4s forwards}

.depths{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.depth{border:1px solid var(--rule-hard);padding:4px 8px;font-size:11px;
  font-variant-numeric:tabular-nums;animation:fade-up .5s both}
.depth b{color:var(--saffron);font-weight:500}
.depth i{font-style:normal;color:var(--muted-2);font-size:9.5px}

.checks{display:flex;flex-direction:column;gap:0;border:1px solid var(--rule-hard)}
.check{display:flex;align-items:center;gap:9px;padding:6px 10px;font-size:11px;
  border-bottom:1px solid var(--rule);background:var(--ink-2)}
.check:last-child{border-bottom:0}
.check .mk{width:12px;text-align:center;font-size:12px;flex:none}
.check.y .mk{color:var(--jade)}
.check.n .mk{color:var(--vermillion)}
.check.n span{color:var(--muted)}
.check .val{margin-left:auto;color:var(--muted-2);font-variant-numeric:tabular-nums;font-size:10.5px}

.empty{
  padding:46px 26px;text-align:center;color:var(--muted-2);
  animation:fade-up .8s .3s cubic-bezier(.16,1,.3,1) both;
}
.empty .glyph{font-family:var(--serif);font-size:40px;color:var(--rule-hard);
  display:block;margin-bottom:12px;line-height:1}
.empty p{font-size:11.5px;line-height:1.75;max-width:250px;margin:0 auto}
.empty em{font-style:normal;color:var(--saffron)}

/* ─────────────────────────────────────────────────────────── footer */
.foot{
  flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:7px 22px;border-top:1px solid var(--rule-hard);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);
  background:rgba(10,11,13,.9);
}
.foot .sp{margin-left:auto}
.ghost{
  background:none;border:1px solid var(--rule-hard);color:var(--muted);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:3px 9px;cursor:pointer;transition:all .2s;
}
.ghost:hover{color:var(--saffron);border-color:rgba(242,160,61,.4);background:var(--saffron-soft)}

/* ───────────────────────────────────────────────────── mobile nav */
nav.tabs{display:none}

@media (max-width:1080px){
  :root{--rail:250px;--detail:290px}
  .d-sym{font-size:26px}
}
@media (max-width:880px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr)}
  .col{display:none;min-height:0}
  .col.active{display:flex}
  .col + .col{border-left:0}
  nav.tabs{
    display:grid;grid-template-columns:repeat(3,1fr);flex:none;
    border-top:1px solid var(--rule-hard);background:rgba(10,11,13,.97);
    backdrop-filter:blur(12px);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    background:none;border:0;border-right:1px solid var(--rule);
    color:var(--muted-2);font-family:var(--mono);font-size:10px;letter-spacing:.13em;
    text-transform:uppercase;padding:13px 4px;cursor:pointer;position:relative;
    transition:color .2s;
  }
  nav.tabs button:last-child{border-right:0}
  nav.tabs button.on{color:var(--saffron)}
  nav.tabs button.on::after{
    content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--saffron);
    animation:tab-in .35s cubic-bezier(.16,1,.3,1)
  }
  @keyframes tab-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  nav.tabs .badge{
    position:absolute;top:7px;right:calc(50% - 30px);min-width:15px;height:15px;
    background:var(--saffron);color:var(--ink);font-size:9px;line-height:15px;
    border-radius:8px;padding:0 4px;font-weight:600;
  }
  header.masthead{padding:10px 15px 8px;gap:8px;align-items:center}
  .wordmark{font-size:21px}
  .tagline{display:none}
  .foot{display:none}
  .results{left:15px;right:15px}
  /* Keep the status strip on one line. The phone's own status bar already
     shows the time, so the clock pill is the one that goes. */
  .masthead-right{flex-wrap:nowrap;gap:6px;min-width:0}
  .pill{padding:3px 7px;font-size:9.5px;letter-spacing:.05em}
  #clock{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <div>
      <div class="wordmark">Night <em>Ledger</em></div>
      <div class="tagline">Minervini VCP · Stage 2 · Momentum · NSE / BSE</div>
    </div>
    <div class="masthead-right">
      <span class="pill" id="clock"><span class="dot beat"></span> <b>--:--:--</b> IST</span>
      <span class="pill" id="phase">market —</span>
      <span class="pill" id="feed">feed —</span>
    </div>
  </header>

  <div class="tape" id="tape"><div class="tape-empty">no instruments on the tape</div></div>

  <div class="toolbar">
    <button class="act primary" id="t-scan">⟳ Screen now</button>
    <button class="act" id="t-seed">+ Starter list</button>
    <button class="act" id="t-diag">◈ Test feed</button>
    <button class="act danger" id="t-clear">✕ Clear tape</button>
    <span class="spacer"></span>
    <span class="note" id="t-note">ready</span>
  </div>

  <div class="banner" id="banner"></div>

  <main>
    <!-- ── 01 watchlist ────────────────────────────────────────────── -->
    <section class="col active" data-col="watch">
      <div class="sec-head panel-in">
        <span class="sec-num">01</span>
        <span class="sec-title">Watchlist</span>
        <span class="sec-meta" id="wl-count">0</span>
      </div>
      <div class="search-wrap panel-in">
        <div class="search-field">
          <input class="search" id="q" type="search" autocomplete="off" spellcheck="false"
                 placeholder="Search Tata, HDFC, INFY…">
        </div>
        <div class="results" id="results"></div>
      </div>
      <div class="col-body" id="wl"></div>
    </section>

    <!-- ── 02 the tape ─────────────────────────────────────────────── -->
    <section class="col" data-col="tape">
      <div class="sec-head panel-in">
        <span class="sec-num">02</span>
        <span class="sec-title">The Tape</span>
        <span class="sec-meta" id="alert-count">0 today</span>
      </div>
      <div class="col-body" id="alerts"></div>
    </section>

    <!-- ── 03 setup ────────────────────────────────────────────────── -->
    <section class="col" data-col="setup">
      <div class="sec-head panel-in">
        <span class="sec-num">03</span>
        <span class="sec-title">Setup</span>
        <span class="sec-meta" id="setup-meta"></span>
      </div>
      <div class="col-body" id="detail"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-tab="watch" class="on">Watchlist</button>
    <button data-tab="tape">Tape<span class="badge" id="tab-badge" hidden>0</span></button>
    <button data-tab="setup">Setup</button>
  </nav>

  <footer class="foot">
    <span id="f-window">window —</span>
    <span id="f-scan">last scan —</span>
    <span id="f-listeners">—</span>
    <span class="sp"></span>
    <button class="ghost" id="btn-scan">Rescan now</button>
    <button class="ghost" id="btn-clear">Clear tape</button>
  </footer>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   State. Read once over REST on boot, then everything streams over SSE.
   ══════════════════════════════════════════════════════════════════════════ */
const S = { watch: [], alerts: [], setups: new Map(), quotes: new Map(),
            selected: null, status: null, freshest: null };

const $  = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => (n === null || n === undefined ? "—" : nf.format(n));
const short = (s) => String(s).replace(/\.(NS|BO)$/i, "");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const MARK = { vcp_setup: "◆", breakout: "▲", momentum: "⚡", system: "•" };
const KIND_LABEL = { vcp_setup: "VCP base", breakout: "Breakout", momentum: "Momentum", system: "System" };

async function api(path, opts) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.status === 204 ? null : r.json();
}

/* ─────────────────────────────────────────────────────────────── clock */
const istFmt = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
setInterval(() => { $("clock").querySelector("b").textContent = istFmt.format(new Date()); }, 1000);
$("clock").querySelector("b").textContent = istFmt.format(new Date());

const timeOf = (iso) => {
  try { return istFmt.format(new Date(iso)); } catch { return "--:--:--"; }
};

/* ──────────────────────────────────────────────────────────── header */
const PHASE = {
  open:       ["hot",  "market open"],
  pre_open:   ["",     "pre-open"],
  post_close: ["",     "post close"],
  closed:     ["",     "market closed"],
};
function renderStatus() {
  const st = S.status; if (!st) return;
  const sc = st.scanner, fd = st.feed || {};
  const [cls, label] = PHASE[sc.market_phase] || ["", sc.market_phase];
  const phase = $("phase");
  phase.className = "pill " + cls;
  phase.innerHTML = `<span class="dot"></span> ${esc(label)}`;

  const feed = $("feed");
  const live = !!fd.live;
  feed.className = "pill " + (live ? "live" : "");
  feed.innerHTML = live
    ? `<span class="dot beat"></span> live ticks · ${esc(fd.name)}`
    : `<span class="dot"></span> delayed · ${esc(fd.name)}`;
  feed.title = fd.delay_note || "";

  const cfg = st.settings || {};
  $("f-window").textContent =
    `trigger +${cfg.momentum_threshold_pct}% / ${cfg.momentum_window_minutes} min · poll ${cfg.poll_seconds}s`;
  $("f-scan").textContent = sc.last_vcp_scan
    ? `last vcp scan ${timeOf(sc.last_vcp_scan)}` : "vcp scan pending";
  $("f-listeners").textContent = `${st.listeners} viewer${st.listeners === 1 ? "" : "s"}`;
  $("alert-count").textContent = `${sc.alerts_today} today`;
  renderHealth();
}

/* ─────────────────────────────────────────────────────────── watchlist */
function renderWatchlist() {
  const host = $("wl");
  $("wl-count").textContent = S.watch.length;
  if (!S.watch.length) {
    host.innerHTML = `<div class="empty"><span class="glyph">◇</span>
      <p>Nothing on the book yet. Search a company above and press <em>+</em>,
      or drop in a dozen liquid NSE names to get going.</p>
      <button class="act primary" data-action="seed">+ Load starter list</button></div>`;
    return;
  }
  host.innerHTML = S.watch.map((w, i) => {
    const q = S.quotes.get(w.symbol);
    const su = S.setups.get(w.symbol);
    const tag = su
      ? (su.valid ? `<span class="wl-tag ok">◆ vcp ${Math.round(su.score)}</span>`
                  : `<span class="wl-tag no">${su.trend?.passed ? "basing" : "stage 1"}</span>`)
      : `<span class="wl-tag no">screening</span>`;
    return `<div class="wl-row ${S.selected === w.symbol ? "sel" : ""}" data-sym="${esc(w.symbol)}"
                 style="animation-delay:${Math.min(i * 22, 400)}ms">
      <div class="wl-sym">${esc(short(w.symbol))}</div>
      <div class="wl-px">${q ? money(q.price) : "—"}</div>
      <div class="wl-name">${esc(w.name || "")}</div>
      ${tag}
      <button class="wl-del" data-del="${esc(w.symbol)}" title="Remove">×</button>
    </div>`;
  }).join("");
}

$("wl").addEventListener("click", async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    const sym = del.dataset.del;
    await api(`/api/watchlist/${encodeURIComponent(sym)}`, { method: "DELETE" });
    S.watch = S.watch.filter((w) => w.symbol !== sym);
    S.setups.delete(sym); S.quotes.delete(sym);
    if (S.selected === sym) { S.selected = null; renderDetail(); }
    renderWatchlist(); renderTape();
    return;
  }
  const row = e.target.closest("[data-sym]");
  if (row) { select(row.dataset.sym); }
});

function select(sym) {
  S.selected = sym;
  renderWatchlist();
  renderDetail();
  if (window.matchMedia("(max-width:880px)").matches) showTab("setup");
}

/* ────────────────────────────────────────────────────────────── search */
let searchTimer = null, lastQuery = "";
$("q").addEventListener("input", (e) => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (!q) { $("results").innerHTML = ""; return; }
  searchTimer = setTimeout(() => runSearch(q), 220);
});
$("q").addEventListener("blur", () => setTimeout(() => { $("results").innerHTML = ""; }, 180));

async function runSearch(q) {
  lastQuery = q;
  let rows = [];
  try { rows = await api(`/api/search?q=${encodeURIComponent(q)}`); }
  catch { rows = []; }
  if (lastQuery !== q) return;
  const have = new Set(S.watch.map((w) => w.symbol));
  $("results").innerHTML = rows.map((r, i) => `
    <button class="result ${have.has(r.symbol) ? "on" : ""}" data-add="${esc(r.symbol)}"
            data-name="${esc(r.name)}" data-exch="${esc(r.exchange)}"
            style="animation-delay:${i * 26}ms">
      <span class="r-sym">${esc(short(r.symbol))}</span>
      <span class="r-name">${esc(r.name)}</span>
      <span class="r-add">${have.has(r.symbol) ? "✓" : "+"}</span>
    </button>`).join("");
}

$("results").addEventListener("mousedown", async (e) => {
  const btn = e.target.closest("[data-add]");
  if (!btn) return;
  e.preventDefault();
  const symbol = btn.dataset.add;
  btn.classList.add("on");
  try {
    const item = await api("/api/watchlist", {
      method: "POST",
      body: JSON.stringify({ symbol, name: btn.dataset.name, exchange: btn.dataset.exch }),
    });
    if (!S.watch.some((w) => w.symbol === item.symbol)) S.watch.push(item);
    renderWatchlist();
    $("q").value = ""; $("results").innerHTML = "";
  } catch (err) { console.error(err); btn.classList.remove("on"); }
});

/* ──────────────────────────────────────────────────────── ticker tape */
function renderTape() {
  const host = $("tape");
  const rows = S.watch.map((w) => ({ w, q: S.quotes.get(w.symbol) })).filter((r) => r.q);
  if (!rows.length) {
    host.innerHTML = `<div class="tape-empty">${S.watch.length ? "awaiting first prices" : "no instruments on the tape"}</div>`;
    return;
  }
  const cell = ({ w, q }) => {
    const su = S.setups.get(w.symbol);
    const mark = su && su.valid ? ` <span style="color:var(--saffron)">◆</span>` : "";
    return `<span class="tape-item"><span class="sym">${esc(short(w.symbol))}</span><span class="px">${money(q.price)}</span>${mark}</span>`;
  };
  const once = rows.map(cell).join("");
  host.innerHTML = `<div class="tape-track">${once}${once}</div>`;
}

/* ───────────────────────────────────────────────────────────── alerts */
function alertRow(a, fresh) {
  return `<article class="alert k-${esc(a.kind)} ${fresh ? "fresh" : ""}" data-sym="${esc(a.symbol)}">
    <div class="a-time">${timeOf(a.ts)}</div>
    <div class="a-mark">${MARK[a.kind] || "•"}</div>
    <div class="a-head"><b>${esc(short(a.symbol))}</b>${esc(a.headline.replace(short(a.symbol), ""))}</div>
    ${a.detail ? `<div class="a-detail">${esc(a.detail)}</div>` : ""}
    <div class="a-kind">${esc(KIND_LABEL[a.kind] || a.kind)}${a.name ? " · " + esc(a.name) : ""}</div>
  </article>`;
}

function renderAlerts() {
  const host = $("alerts");
  if (!S.alerts.length) {
    const closed = S.status && S.status.scanner.market_phase === "closed";
    host.innerHTML = `<div class="empty"><span class="glyph">〰</span>
      <p>The tape is quiet. Alerts print here when a base completes, a pivot
      breaks, or a name moves <em>+2% inside 15 minutes</em>.</p>
      <p style="margin-top:10px">${closed
        ? "NSE is closed right now, so nothing is moving — but you can screen your watchlist for VCP bases on today's daily bars any time."
        : "Screening runs automatically every 30 minutes. Force a pass now if you don't want to wait."}</p>
      <button class="act primary" data-action="scan">⟳ Screen now</button></div>`;
    return;
  }
  host.innerHTML = S.alerts.slice(0, 200)
    .map((a) => alertRow(a, a.id === S.freshest)).join("");
}

$("alerts").addEventListener("click", (e) => {
  const row = e.target.closest("[data-sym]");
  if (row && S.watch.some((w) => w.symbol === row.dataset.sym)) select(row.dataset.sym);
});

/* ────────────────────────────────────────────────────── setup detail */
function vcpChart(su) {
  const cs = su.contractions || [];
  if (cs.length < 1) return "";
  const pts = [];
  cs.forEach((c) => { pts.push(c.high); pts.push(c.low); });
  const all = pts.concat(su.pivot ? [su.pivot] : []).concat(su.trend?.price ? [su.trend.price] : []);
  const hi = Math.max(...all), lo = Math.min(...all);
  const span = (hi - lo) || 1;
  // Right gutter keeps the pivot/stop captions off the price line.
  const W = 320, H = 108, PAD = 10, GUTTER = 62;
  const y = (v) => PAD + (1 - (v - lo) / span) * (H - PAD * 2);
  const step = (W - PAD - GUTTER) / (pts.length - 1 || 1);
  const x = (i) => PAD + i * step;
  const path = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const nodes = pts.map((v, i) =>
    `<circle class="node" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2"
       style="animation-delay:${(0.25 + i * 0.13).toFixed(2)}s"/>`).join("");
  const rail = W - GUTTER + 6;
  const pivotLine = su.pivot
    ? `<line class="pivot" x1="0" y1="${y(su.pivot).toFixed(1)}" x2="${rail}" y2="${y(su.pivot).toFixed(1)}"/>
       <text x="${rail + 4}" y="${(y(su.pivot) + 3).toFixed(1)}"
             style="fill:var(--jade)">▲ ${money(su.pivot)}</text>` : "";
  const stopLine = su.stop
    ? `<line class="stopline" x1="0" y1="${y(su.stop).toFixed(1)}" x2="${rail}" y2="${y(su.stop).toFixed(1)}"/>
       <text x="${rail + 4}" y="${(y(su.stop) + 3).toFixed(1)}"
             style="fill:var(--vermillion)">▼ ${money(su.stop)}</text>` : "";
  // No preserveAspectRatio="none" — stretching the viewBox would smear the
  // pivot/stop captions along with the price line.
  return `<svg class="vcp" viewBox="0 0 ${W} ${H}"
               role="img" aria-label="volatility contraction pattern">
    ${pivotLine}${stopLine}<path class="leg" d="${path}"/>${nodes}</svg>`;
}

const CHECKS = [
  ["above_sma50",  "Price &gt; 50 SMA",     (t) => money(t.sma50)],
  ["above_sma150", "Price &gt; 150 SMA",    (t) => money(t.sma150)],
  ["above_sma200", "Price &gt; 200 SMA",    (t) => money(t.sma200)],
  ["sma_stacked",  "50 &gt; 150 &gt; 200",  () => ""],
  ["sma200_rising","200 SMA rising",        () => ""],
  ["above_52w_low","&ge;25% off 52w low",   (t) => `+${t.pct_above_52w_low}%`],
  ["near_52w_high","Within 25% of high",    (t) => `−${t.pct_below_52w_high}%`],
  ["rs_ok",        "Beating the index",     (t) => `${t.rs_score > 0 ? "+" : ""}${t.rs_score}%`],
];

function renderDetail() {
  const host = $("detail");
  const sym = S.selected;
  if (!sym) {
    host.innerHTML = `<div class="empty"><span class="glyph">◈</span>
      <p>Pick a name from the book to see its contractions, buy point and
      <em>Stage 2</em> scorecard.</p></div>`;
    $("setup-meta").textContent = "";
    return;
  }
  const su = S.setups.get(sym);
  const w = S.watch.find((x) => x.symbol === sym);
  const q = S.quotes.get(sym);
  $("setup-meta").textContent = su ? su.as_of : "";

  if (!su) {
    host.innerHTML = `<div class="detail-pad"><div class="d-sym">${esc(short(sym))}</div>
      <div class="d-name">${esc(w?.name || "")}</div>
      <div class="verdict no"><span class="dot"></span> screening…</div>
      <div class="reason">Pulling a year of daily bars and running the trend template.</div></div>`;
    return;
  }

  const t = su.trend || {};
  const price = q ? q.price : t.price;
  // Distance from where it trades now to the buy point — the one number that
  // says "watch this today" versus "check back next week".
  let toPivot = "—", toPivotCls = "";
  if (su.pivot && price) {
    const d = (su.pivot - price) / su.pivot * 100;
    toPivot = d <= 0 ? `${Math.abs(d).toFixed(1)}% above` : `${d.toFixed(1)}%`;
    toPivotCls = d <= 0 ? "j" : (d < 3 ? "s" : "");
  }
  const stats = su.valid ? `
    <dl class="stats">
      <div class="stat"><dt>Buy point</dt><dd class="j">${money(su.pivot)}</dd></div>
      <div class="stat"><dt>Stop</dt><dd class="v">${money(su.stop)}</dd></div>
      <div class="stat"><dt>To buy point</dt><dd class="${toPivotCls}">${toPivot}</dd></div>
      <div class="stat"><dt>Risk at pivot</dt><dd>${su.risk_pct ?? "—"}%</dd></div>
      <div class="stat"><dt>Quality</dt><dd class="s">${Math.round(su.score)}<span style="font-size:11px;color:var(--muted-2)">/100</span></dd></div>
      <div class="stat"><dt>Volume vs 50d</dt><dd class="${su.volume_dryup < .6 ? "j" : ""}">${su.volume_dryup !== null ? Math.round(su.volume_dryup * 100) + "%" : "—"}</dd></div>
    </dl>` : "";

  const depths = (su.contractions || []).map((c, i) => `
    <span class="depth" style="animation-delay:${(i * 70 + 200)}ms">
      <b>${c.depth_pct}%</b> <i>${c.bars}d</i></span>`).join("");

  host.innerHTML = `<div class="detail-pad">
    <div class="d-sym">${esc(short(sym))}</div>
    <div class="d-name">${esc(su.name || w?.name || "")}${price ? " · " + money(price) : ""}</div>
    <div class="verdict ${su.valid ? "ok" : "no"}">
      <span class="dot"></span>${su.valid ? "VCP base complete" : "no setup"}</div>
    ${su.reason ? `<div class="reason">${esc(su.reason)}</div>` : ""}
    ${stats}
    ${(su.contractions || []).length ? `
      <div class="d-label">Contractions</div>
      ${vcpChart(su)}
      <div class="depths">${depths}</div>` : ""}
    <div class="d-label">Trend template</div>
    <div class="checks">
      ${CHECKS.map(([k, label, val]) => `
        <div class="check ${t[k] ? "y" : "n"}">
          <span class="mk">${t[k] ? "✓" : "✕"}</span><span>${label}</span>
          <span class="val">${val(t) || ""}</span></div>`).join("")}
    </div>
    <div class="d-label">Base</div>
    <div class="checks"><div class="check y"><span class="mk">·</span>
      <span>${su.base_days || 0} sessions since the base began</span></div></div>
  </div>`;
}

/* ───────────────────────────────────────────────────────── mobile tabs */
function showTab(name) {
  document.querySelectorAll(".col").forEach((c) => c.classList.toggle("active", c.dataset.col === name));
  document.querySelectorAll("nav.tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === name));
  if (name === "tape") { unread = 0; paintBadge(); }
}
document.querySelectorAll("nav.tabs button").forEach((b) =>
  b.addEventListener("click", () => showTab(b.dataset.tab)));

let unread = 0;
function paintBadge() {
  const el = $("tab-badge");
  el.hidden = unread === 0;
  el.textContent = unread > 99 ? "99+" : unread;
}

/* ──────────────────────────────────────────────────────────── actions */
const STARTER = [
  ["RELIANCE.NS", "Reliance Industries"], ["HDFCBANK.NS", "HDFC Bank"],
  ["ICICIBANK.NS", "ICICI Bank"], ["INFY.NS", "Infosys"],
  ["TCS.NS", "Tata Consultancy Services"], ["TATAMOTORS.NS", "Tata Motors"],
  ["DIXON.NS", "Dixon Technologies"], ["TRENT.NS", "Trent"],
  ["BEL.NS", "Bharat Electronics"], ["HAL.NS", "Hindustan Aeronautics"],
  ["POLYCAB.NS", "Polycab India"], ["PERSISTENT.NS", "Persistent Systems"],
];

const note = (msg) => { const el = $("t-note"); if (el) el.textContent = msg; };

/** Screening pulls a year of daily bars per symbol, so it is genuinely slow
 *  the first time. Say so rather than leaving a dead button. */
async function runScan(btn) {
  const label = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "⟳ Screening…"; }
  note(`screening ${S.watch.length} symbol${S.watch.length === 1 ? "" : "s"}…`);
  try {
    const r = await api("/api/scan", { method: "POST" });
    note(r.blocked
      ? `screened ${r.scanned} · no data returned`
      : `${r.fetched}/${r.scanned} fetched · ${r.valid_setups} valid setup${r.valid_setups === 1 ? "" : "s"}`);
    await loadWatchlist();
    autoSelect(); renderWatchlist(); renderDetail();
    try { S.status = await api("/api/status"); renderStatus(); } catch {}
  } catch (err) {
    note("scan failed — check the service logs");
    banner("<b>The screening request failed.</b> If the service was asleep it can take "
      + "~50 seconds to wake on the free plan — try again.", false);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

async function addStarter(btn) {
  const label = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "+ Adding…"; }
  const have = new Set(S.watch.map((w) => w.symbol));
  let added = 0;
  for (const [symbol, name] of STARTER) {
    if (have.has(symbol)) continue;
    try { await api("/api/watchlist", { method: "POST", body: JSON.stringify({ symbol, name }) }); added++; }
    catch (e) { /* keep going; one bad ticker should not stop the rest */ }
  }
  await loadWatchlist();
  autoSelect(); renderWatchlist(); renderDetail();
  note(added ? `added ${added} symbols — screening…` : "already on the list");
  if (btn) { btn.disabled = false; btn.textContent = label; }
  if (added) runScan(null);
}

function banner(html, good) {
  const el = $("banner");
  if (!html) { el.className = "banner"; el.innerHTML = ""; return; }
  el.className = "banner on" + (good ? " good" : "");
  el.innerHTML = `<span class="mark">${good ? "✓" : "!"}</span><span>${html}</span>`;
}

async function diagnose(btn) {
  const label = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = "◈ Testing…"; }
  note("probing the price feed…");
  try {
    const d = await api("/api/diagnostics");
    note(d.ok ? `feed ok · ${d.latency_ms} ms` : "feed unavailable");
    banner(
      `<b>${d.ok ? "Price feed reachable." : "Price feed problem."}</b> ${esc(d.summary)}`
      + (d.error ? `<br><span style="color:var(--muted)">${esc(d.error)}</span>` : ""),
      d.ok
    );
  } catch (err) {
    note("diagnostics failed");
    banner("<b>Could not reach the server.</b> It may be waking from sleep — wait ~50s and retry.", false);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

/** Turn the last screening pass into a plain-English verdict. */
function renderHealth() {
  const h = S.status && S.status.scanner && S.status.scanner.data_health;
  if (!h) return;
  if (h.blocked) {
    banner(
      `<b>No price data came back for any of your ${h.requested} symbols.</b> `
      + "The scanner is running fine — the data provider is refusing this host. "
      + "Yahoo rate-limits cloud IPs. Press <em>Test feed</em> for detail, retry in "
      + "a few minutes, or move to a broker feed.", false);
  } else if (h.fetched && h.fetched < h.requested) {
    banner(`<b>${h.fetched} of ${h.requested} symbols returned data.</b> `
      + `No bars for ${h.missing.map(esc).join(", ")} — usually a wrong ticker or a `
      + "temporary provider hiccup.", false);
  } else {
    banner("");
  }
}

async function clearTape() {
  await api("/api/alerts", { method: "DELETE" });
  S.alerts = []; renderAlerts(); note("tape cleared");
}

const wire = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", () => fn(el)); };
wire("t-scan", runScan);
wire("t-seed", addStarter);
wire("t-diag", diagnose);
wire("t-clear", clearTape);
wire("btn-scan", runScan);
wire("btn-clear", clearTape);
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-action]");
  if (!a) return;
  ({ scan: runScan, seed: addStarter })[a.dataset.action]?.(a);
});

/* ──────────────────────────────────────────────────────── live stream */
function connect() {
  const es = new EventSource("/api/stream");

  es.addEventListener("alert", (e) => {
    const a = JSON.parse(e.data);
    S.alerts.unshift(a);
    S.freshest = a.id;
    renderAlerts();
    if (!document.querySelector('.col[data-col="tape"]').classList.contains("active")
        && window.matchMedia("(max-width:880px)").matches) { unread++; paintBadge(); }
    if (a.kind !== "system" && "vibrate" in navigator) navigator.vibrate(28);
  });

  es.addEventListener("quotes", (e) => {
    for (const q of JSON.parse(e.data)) S.quotes.set(q.symbol, q);
    renderWatchlist(); renderTape();
    if (S.selected) renderDetail();
  });

  es.addEventListener("setups", (e) => {
    for (const s of JSON.parse(e.data)) S.setups.set(s.symbol, s);
    renderWatchlist(); renderTape();
    if (S.selected) renderDetail();
  });

  es.addEventListener("watchlist", async () => { await loadWatchlist(); });

  es.onerror = () => { /* EventSource reconnects on its own via `retry:` */ };
}

/* ───────────────────────────────────────────────────────────── boot */
async function loadWatchlist() {
  const rows = await api("/api/watchlist");
  S.watch = rows.map(({ setup, quote, ...w }) => w);
  rows.forEach((r) => {
    if (r.setup) S.setups.set(r.symbol, r.setup);
    if (r.quote) S.quotes.set(r.symbol, r.quote);
  });
  renderWatchlist(); renderTape();
}

/** Open on the best setup rather than an empty panel — on a phone the Setup
 *  tab is otherwise a dead end until you tap something. */
function autoSelect() {
  if (S.selected || !S.watch.length) return;
  const ranked = S.watch
    .map((w) => ({ sym: w.symbol, su: S.setups.get(w.symbol) }))
    .sort((a, b) => (b.su?.valid ? 1 : 0) - (a.su?.valid ? 1 : 0)
                 || (b.su?.score || 0) - (a.su?.score || 0));
  S.selected = ranked[0].sym;
}

async function boot() {
  try {
    const [status, , alerts] = await Promise.all([
      api("/api/status"), loadWatchlist(), api("/api/alerts?limit=200"),
    ]);
    S.status = status; S.alerts = alerts;
    renderStatus(); renderAlerts();
    autoSelect();
    renderWatchlist(); renderDetail();
  } catch (err) {
    console.error(err);
    $("alerts").innerHTML = `<div class="empty"><span class="glyph">!</span>
      <p>Could not reach the scanner. It may still be waking up — this page
      retries on its own.</p></div>`;
  }
  connect();
  setInterval(async () => {
    try { S.status = await api("/api/status"); renderStatus(); } catch {}
  }, 30000);
}
boot();
</script>
